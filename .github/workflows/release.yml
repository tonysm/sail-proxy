name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: ramsey/composer-install@v3

      # Gate the release on the same checks CI runs: a tag pushed by hand
      # (bypassing scripts/release.sh) must not ship code that fails them.
      - name: Run the checks
        run: |
          vendor/bin/pint --test
          vendor/bin/pest

      # The archive is committed, and Composer installs it straight from the
      # tag, so a stale build ships silently. Make that a failed release
      # instead: the version baked in at build time has to match the tag.
      - name: Check the committed archive was rebuilt for this tag
        run: |
          chmod +x builds/sail-proxy
          BUILT="$(./builds/sail-proxy --version)"
          echo "archive reports: $BUILT"
          if ! grep -qF "${{ github.ref_name }}" <<< "$BUILT"; then
            echo "::error::builds/sail-proxy reports '$BUILT' but the tag is '${{ github.ref_name }}'."
            echo "::error::Release with 'scripts/release.sh ${GITHUB_REF_NAME}' — it rebuilds and commits the archive before tagging."
            exit 1
          fi

      # Bare filename in the checksums, so `sha256sum -c` works from a
      # directory holding just the downloaded assets.
      - name: Generate checksums
        run: (cd builds && sha256sum sail-proxy) > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            builds/sail-proxy
            checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            builds/sail-proxy
            checksums.txt
          # Tags with a suffix (v1.2.3-rc.1) become prereleases: never marked
          # Latest, and mise skips them when resolving "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ### Install

            **mise:**
            ```sh
            mise use -g github:tonysm/sail-proxy
            ```

            **Composer:**
            ```sh
            composer global require tonysm/sail-proxy
            ```

            **Direct download:**
            ```sh
            curl -L https://github.com/tonysm/sail-proxy/releases/latest/download/sail-proxy -o ~/.local/bin/sail-proxy
            chmod +x ~/.local/bin/sail-proxy
            ```

            Requires PHP 8.4+ on your PATH.
